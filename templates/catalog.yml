# Метаданные Skill для каталога README.
# Скопируйте этот файл в skills/<skill-name>/catalog.yml и заполните.
# Поля SKILL.md не изменяйте — каталог читает только этот файл.

# Обязательные поля:
title_ru: ""            # короткое понятное русское название
summary_ru: ""          # краткое описание конкретной задачи Skill (1–2 предложения)
category_ru: ""         # категория для группировки в каталоге
status: planned         # одно из: planned, beta, published, deprecated

# Необязательные поля:
# tags:                # короткие поисковые темы на русском
#   - пример-тега
